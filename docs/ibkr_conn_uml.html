<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ibkr_conn — Architecture Diagram</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --cli: #bfdbfe; --cli-border: #60a5fa;
    --app: #c7d2fe; --app-border: #818cf8;
    --lib: #e2e8f0; --lib-border: #94a3b8;
    --ext: #fde68a; --ext-border: #facc15;
    --sto: #99f6e4; --sto-border: #2dd4bf;
    --dto: #c4b5fd; --dto-border: #a78bfa;
    --risk: #fecaca; --risk-border: #f87171;
    --res: #d9ead3; --res-border: #86efac;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --fg: #e5e7eb; --muted: #a3adbd; --line: #94a3b8;
      --cli: #1d4ed8; --cli-border: #60a5fa;
      --app: #4338ca; --app-border: #818cf8;
      --lib: #334155; --lib-border: #64748b;
      --ext: #92400e; --ext-border: #facc15;
      --sto: #0f766e; --sto-border: #2dd4bf;
      --dto: #5b21b6; --dto-border: #a78bfa;
      --risk: #991b1b; --risk-border: #f87171;
      --res: #14532d; --res-border: #86efac;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 32px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title    { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .subtitle { font-size: 13px; fill: var(--muted); }
  .label    { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small    { font-size: 11px; fill: var(--muted); }
  .method   { font-size: 10px; fill: var(--muted); }
  .node     { stroke-width: 1.5; rx: 6; ry: 6; }
  .cat-cli  { fill: var(--cli); stroke: var(--cli-border); }
  .cat-app  { fill: var(--app); stroke: var(--app-border); }
  .cat-lib  { fill: var(--lib); stroke: var(--lib-border); }
  .cat-ext  { fill: var(--ext); stroke: var(--ext-border); }
  .cat-sto  { fill: var(--sto); stroke: var(--sto-border); }
  .cat-dto  { fill: var(--dto); stroke: var(--dto-border); }
  .cat-risk { fill: var(--risk); stroke: var(--risk-border); }
  .cat-res  { fill: var(--res); stroke: var(--res-border); }
  .edge     { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .dashed   { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .zone     { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.6; }
  .zone-label { font-size: 11px; fill: var(--muted); }
</style>

  <text x="600" y="30" text-anchor="middle" class="title">ibkr_conn — Module Architecture</text>
  <text x="600" y="48" text-anchor="middle" class="subtitle">8 Python modules · 3 zones · Typed DTOs · Singleton SessionManager · Runtime resources</text>
  <rect x="30" y="60" width="1140" height="170" class="zone"/>
  <text x="40" y="77" class="zone-label">CLI Entry</text>
  <rect x="40" y="95" width="240" height="120" class="node cat-cli" />
  <text x="160" y="115" text-anchor="middle" class="label">run_service.py</text>
  <text x="160" y="131" text-anchor="middle" class="label">CLI entry point</text>
  <text x="48" y="149" class="method">main() — dispatch by --mode</text>
  <text x="48" y="162" class="method">build_ibkr_parser() — argparse</text>
  <text x="48" y="175" class="method">_clean_stale_pycache()</text>
  <text x="48" y="188" class="method">_handle_status() — health output</text>
  <text x="48" y="201" class="method">configure_pipeline_logging() — init</text>
  <rect x="30" y="240" width="1140" height="470" class="zone"/>
  <text x="40" y="257" class="zone-label">Application Logic</text>
  <rect x="40" y="275" width="270" height="155" class="node cat-app" />
  <text x="175" y="295" text-anchor="middle" class="label">session_manager.py  🔒 Singleton</text>
  <text x="175" y="311" text-anchor="middle" class="label">SessionManager — owns IB + QuestDB</text>
  <text x="48" y="329" class="method">get_ib_conn()  (6×5s internal retry)</text>
  <text x="48" y="342" class="method">get_questdb() → QuestDBManager</text>
  <text x="48" y="355" class="method">on_error()  (signal connection death)</text>
  <text x="48" y="368" class="method">start() / stop() — gateway lifecycle</text>
  <text x="48" y="381" class="method">get_status() · keepalive · PID locks</text>
  <text x="48" y="394" class="method">→ IBConnectionFatalError (6 fails)</text>
  <rect x="350" y="275" width="270" height="155" class="node cat-lib" />
  <text x="485" y="295" text-anchor="middle" class="label">data_downloader.py  📦 Client</text>
  <text x="485" y="311" text-anchor="middle" class="label">DataDownloader — uses SessionManager</text>
  <text x="358" y="329" class="method">download_bars()  (error recovery loop)</text>
  <text x="358" y="342" class="method">start_streaming()  (PID-locked entry)</text>
  <text x="358" y="355" class="method">stream_ticks()  (keepalive loop)</text>
  <text x="358" y="368" class="method">  → IBConnectionFatalError on abort</text>
  <text x="358" y="381" class="method">_load_tick_config()  (JSON config)</text>
  <text x="358" y="394" class="method">_do_bars_download()  (core bars logic)</text>
  <rect x="660" y="275" width="200" height="155" class="node cat-lib" />
  <text x="760" y="295" text-anchor="middle" class="label">utils.py</text>
  <text x="760" y="311" text-anchor="middle" class="label">Shared utilities (no connections)</text>
  <text x="668" y="329" class="method">build_ric_contract()</text>
  <text x="668" y="342" class="method">resolve_contracts()</text>
  <text x="668" y="355" class="method">get_contract()</text>
  <text x="668" y="368" class="method">parse_date_range()</text>
  <text x="668" y="381" class="method">_month_map()</text>
  <rect x="40" y="475" width="270" height="150" class="node cat-app" />
  <text x="175" y="495" text-anchor="middle" class="label">ibgateway.py</text>
  <text x="175" y="511" text-anchor="middle" class="label">Gateway lifecycle (no ib_insync)</text>
  <text x="48" y="529" class="method">IBGateway class:</text>
  <text x="48" y="542" class="method">  start_gateway() — subprocess</text>
  <text x="48" y="555" class="method">  stop_gateway() — nc + kill</text>
  <text x="48" y="568" class="method">  ensure_gateway() — auto-restart</text>
  <text x="48" y="581" class="method">  wait_for_api() — poll</text>
  <text x="48" y="594" class="method">  generate_config_ini()</text>
  <text x="48" y="607" class="method">  get_credentials()</text>
  <text x="48" y="620" class="method">Module-level: install_scripts()</text>
  <rect x="350" y="475" width="270" height="150" class="node cat-app" />
  <text x="485" y="495" text-anchor="middle" class="label">questdb.py</text>
  <text x="485" y="511" text-anchor="middle" class="label">QuestDBManager — ILP write operations</text>
  <text x="358" y="529" class="method">QuestDBManager (class):</text>
  <text x="358" y="542" class="method">  send_ilp_batch() — HTTP POST /write</text>
  <text x="358" y="555" class="method">  write_bars() → futures_hist table</text>
  <text x="358" y="568" class="method">  write_ticks() → futures_tick table</text>
  <text x="358" y="581" class="method">Static: is_port_open(), is_questdb_running(), find_questdb_pid()</text>
  <text x="358" y="594" class="method">Module-level: start_questdb(), stop_questdb()</text>
  <rect x="660" y="475" width="240" height="130" class="node cat-risk" />
  <text x="780" y="495" text-anchor="middle" class="label">🔐 IB() Guard Rule</text>
  <text x="780" y="511" text-anchor="middle" class="label">Only session_manager.py may</text>
  <text x="780" y="527" text-anchor="middle" class="label">construct ib_insync.IB()</text>
  <text x="780" y="543" text-anchor="middle" class="label">or call ib.connect().</text>
  <text x="668" y="561" class="method">Enforce:</text>
  <text x="668" y="574" class="method">grep -rn "IB()" --include="*.py" .</text>
  <text x="668" y="587" class="method">  | grep -v venv | grep -v __pycache__</text>
  <rect x="30" y="720" width="1140" height="170" class="zone"/>
  <text x="40" y="737" class="zone-label">External Dependencies</text>

  <text x="150" y="770" text-anchor="middle" class="label">IB Gateway (TWS)</text>
  <text x="150" y="786" text-anchor="middle" class="label">TCP :4002 — Paper/live</text>
  <text x="48" y="804" class="method">ib_insync library</text>
  <text x="48" y="817" class="method">IBC controller</text>
  <rect x="300" y="750" width="220" height="90" class="node cat-sto" />
  <text x="410" y="770" text-anchor="middle" class="label">QuestDB Server</text>
  <text x="410" y="786" text-anchor="middle" class="label">HTTP :9000 / ILP :9009</text>
  <text x="308" y="804" class="method">futures_hist table</text>
  <text x="308" y="817" class="method">futures_tick table</text>
  <rect x="560" y="750" width="180" height="90" class="node cat-sto" />
  <text x="650" y="770" text-anchor="middle" class="label">CSV File System</text>
  <text x="650" y="786" text-anchor="middle" class="label">Data directory</text>
  <text x="568" y="804" class="method">bars CSV export</text>
  <text x="568" y="817" class="method">(--format csv mode)</text>
  <rect x="930" y="95" width="200" height="130" class="node cat-dto" />
  <text x="1030" y="115" text-anchor="middle" class="label">data_record.py</text>
  <text x="1030" y="131" text-anchor="middle" class="label">Typed DTOs (NamedTuple)</text>
  <text x="938" y="149" class="method">HistBarData:</text>
  <text x="938" y="162" class="method">  date, open, high, low, close</text>
  <text x="938" y="175" class="method">  volume, bar_count, average</text>
  <text x="938" y="188" class="method">FutureTickData:</text>
  <text x="938" y="201" class="method">  time, bid, ask, last</text>
  <text x="938" y="214" class="method">  bid_size, ask_size, last_size</text>
  <rect x="930" y="250" width="200" height="130" class="node cat-lib" />
  <text x="1030" y="270" text-anchor="middle" class="label">logger.py</text>
  <text x="1030" y="286" text-anchor="middle" class="label">Structured logging (Singleton)</text>
  <text x="938" y="304" class="method">configure_pipeline_logging()</text>
  <text x="938" y="317" class="method">  → console (stdout) INFO</text>
  <text x="938" y="330" class="method">  → rotating file DEBUG (10MB×3)</text>
  <text x="938" y="343" class="method">get_logger(name) — idempotent</text>
  <rect x="30" y="900" width="1140" height="140" class="zone"/>
  <text x="40" y="917" class="zone-label">Runtime Resources</text>
  <rect x="40" y="930" width="220" height="90" class="node cat-res" />
  <text x="150" y="950" text-anchor="middle" class="label">configs/</text>
  <text x="150" y="966" text-anchor="middle" class="label">Configuration files</text>
  <text x="48" y="984" class="method">download_live_tick.json — RIC list</text>
  <text x="48" y="997" class="method">.ibkr_keepalive — on/off flag</text>
  <text x="48" y="1010" class="method">.ibkr_stream.pid — PID lock</text>
  <text x="48" y="1023" class="method">.ibkr_gateway.pid — PID lock</text>
  <rect x="300" y="930" width="200" height="90" class="node cat-res" />
  <text x="400" y="950" text-anchor="middle" class="label">scripts/</text>
  <text x="400" y="966" text-anchor="middle" class="label">IBC shell scripts</text>

  <text x="308" y="1010" class="method">stop.sh, version</text>
  <rect x="540" y="930" width="180" height="90" class="node cat-res" />

  <text x="630" y="966" text-anchor="middle" class="label">Rotating log files</text>
