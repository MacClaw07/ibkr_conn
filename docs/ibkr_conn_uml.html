  <text x="600" y="30" text-anchor="middle" class="title">ibkr_conn — Module Architecture</text>
  <text x="600" y="48" text-anchor="middle" class="subtitle">Updated: July 2026 · 8 Python modules · 3 zones · Typed DTOs · Singleton SessionManager · Runtime resources</text>
  <rect x="30" y="60" width="1140" height="190" class="zone"/>
  <text x="40" y="77" class="zone-label">CLI Entry</text>
  <rect x="40" y="95" width="280" height="140" class="node cat-cli" />
  <text x="180" y="115" text-anchor="middle" class="label">run_service.py</text>
  <text x="180" y="131" text-anchor="middle" class="label">CLI entry point</text>
  <text x="48" y="149" class="method">Auto-reinvoke with project venv (os.execv)</text>
  <text x="48" y="162" class="method">main() — dispatch by --mode</text>
  <text x="48" y="175" class="method">build_ibkr_parser() — argparse</text>
  <text x="48" y="188" class="method">_clean_stale_pycache()</text>
  <text x="48" y="201" class="method">_handle_status() — health output</text>
  <text x="48" y="214" class="method">configure_pipeline_logging() — init</text>
  <rect x="30" y="260" width="1140" height="470" class="zone"/>
  <text x="40" y="277" class="zone-label">Application Logic</text>
  <rect x="40" y="290" width="290" height="175" class="node cat-app" />
  <text x="185" y="310" text-anchor="middle" class="label">session_manager.py  🔒 Singleton</text>
  <text x="185" y="326" text-anchor="middle" class="label">SessionManager — owns IB + QuestDB</text>
  <text x="48" y="344" class="method">get_ib_conn()  (6×5s internal retry)</text>
  <text x="48" y="357" class="method">get_questdb() → QuestDBManager</text>
  <text x="48" y="370" class="method">on_error()  (signal connection death)</text>
  <text x="48" y="383" class="method">start() / stop() — gateway lifecycle</text>
  <text x="48" y="396" class="method">get_status() · keepalive · set_keepalive()</text>
  <text x="48" y="409" class="method">acquire_pid_lock() / release_pid_lock()</text>
  <text x="48" y="422" class="method">_ensure_gateway_ready() · set_gateway_status()</text>
  <text x="48" y="435" class="method">_get_gateway_status() · _force_disconnect_ib()</text>
  <text x="48" y="448" class="method">_on_gateway_terminated(pid) — callback</text>
  <text x="48" y="461" class="method">→ IBConnectionFatalError (6 fails)</text>
  <rect x="370" y="290" width="290" height="175" class="node cat-lib" />
  <text x="515" y="310" text-anchor="middle" class="label">data_downloader.py  📦 Client</text>
  <text x="515" y="326" text-anchor="middle" class="label">DataDownloader — uses SessionManager</text>
  <text x="378" y="344" class="method">download_bars()  (error recovery loop)</text>
  <text x="378" y="357" class="method">start_streaming()  (PID-locked entry)</text>
  <text x="378" y="370" class="method">stream_ticks()  (keepalive loop)</text>
  <text x="378" y="383" class="method">  → IBConnectionFatalError on abort</text>
  <text x="378" y="396" class="method">_load_tick_config()  (JSON config)</text>
  <text x="378" y="409" class="method">_do_bars_download()  (core bars logic)</text>
  <text x="378" y="422" class="method">Module-level helpers:</text>
  <text x="378" y="435" class="method">  _generate_chunks() · _fetch_chunk()</text>
  <text x="378" y="448" class="method">  _download_bars() · _to_hist_bar() · _bars_to_csv()</text>
  <text x="378" y="461" class="method">  _build_ilp_line() — ILP formatter</text>
  <text x="378" y="474" class="method">  stream_live_ticks(ib, ..., send_batch=...)</text>
  <rect x="700" y="290" width="200" height="175" class="node cat-lib" />
  <text x="800" y="310" text-anchor="middle" class="label">utils.py</text>
  <text x="800" y="326" text-anchor="middle" class="label">Shared utilities (no connections)</text>
  <text x="708" y="344" class="method">build_ric_contract()</text>
  <text x="708" y="357" class="method">resolve_contracts()</text>
  <text x="708" y="370" class="method">get_contract()</text>
  <text x="708" y="383" class="method">parse_date_range()</text>
  <text x="708" y="396" class="method">_month_map()</text>
  <rect x="40" y="500" width="290" height="180" class="node cat-app" />
  <text x="185" y="520" text-anchor="middle" class="label">ibgateway.py</text>
  <text x="185" y="536" text-anchor="middle" class="label">Gateway lifecycle (no ib_insync)</text>
  <text x="48" y="554" class="method">IBGateway class:</text>
  <text x="48" y="567" class="method">  __init__(on_gateway_terminated=[])</text>
  <text x="48" y="580" class="method">  generate_config_ini(self) — instance method</text>
  <text x="48" y="593" class="method">  get_credentials() — static method</text>
  <text x="48" y="606" class="method">  add_gateway_terminated_handler()</text>
  <text x="48" y="619" class="method">  start_gateway() — subprocess start</text>
  <text x="48" y="632" class="method">  stop_gateway() — nc + kill</text>
  <text x="48" y="645" class="method">  ensure_gateway(mgr) — auto-restart</text>
  <text x="48" y="658" class="method">  wait_for_api(mgr) — poll</text>
  <text x="48" y="671" class="method">Module-level:</text>
  <text x="48" y="684" class="method">  get_credentials() · generate_config_ini()</text>
  <text x="48" y="697" class="method">  install_scripts()</text>
  <rect x="370" y="500" width="290" height="180" class="node cat-app" />
  <text x="515" y="520" text-anchor="middle" class="label">questdb.py</text>
  <text x="515" y="536" text-anchor="middle" class="label">QuestDBManager — ILP write operations</text>
  <text x="378" y="554" class="method">QuestDBManager:</text>
  <text x="378" y="567" class="method">  __init__(host, port=9000)</text>
  <text x="378" y="580" class="method">  url property → REST base URL</text>
  <text x="378" y="593" class="method">  send_ilp_batch() → int (count written)</text>
  <text x="378" y="606" class="method">  write_bars() → futures_hist table</text>
  <text x="378" y="619" class="method">  write_ticks() → futures_tick table</text>
  <text x="378" y="632" class="method">  Static: is_port_open(), is_questdb_running()</text>
  <text x="378" y="645" class="method">  Static: find_questdb_pid()</text>
  <text x="378" y="658" class="method">  Static: _ok(val) — NaN check</text>
  <text x="378" y="671" class="method">  Static: _format_ilp_timestamp(dt) → nanosec</text>
  <text x="378" y="684" class="method">Module-level:</text>
  <text x="378" y="697" class="method">  start_questdb() · stop_questdb()</text>
  <text x="378" y="710" class="method">  (called by SessionManager)</text>
  <rect x="700" y="515" width="240" height="130" class="node cat-risk" />
  <text x="820" y="535" text-anchor="middle" class="label">🔐 IB() Guard Rule</text>
  <text x="820" y="551" text-anchor="middle" class="label">Only session_manager.py may</text>
  <text x="820" y="567" text-anchor="middle" class="label">construct ib_insync.IB()</text>
  <text x="820" y="583" text-anchor="middle" class="label">or call ib.connect().</text>
  <text x="708" y="601" class="method">Enforce:</text>
  <text x="708" y="614" class="method">grep -rn "IB()" --include="*.py" .</text>
  <text x="708" y="627" class="method">  | grep -v venv | grep -v __pycache__</text>
  <text x="708" y="640" class="method">(ibgateway.py probes use temp IB</text>
  <text x="708" y="653" class="method"> but never export it)</text>

  <text x="1040" y="131" text-anchor="middle" class="label">Typed DTOs (NamedTuple)</text>
  <text x="938" y="149" class="method">HistBarData:</text>

  <text x="938" y="175" class="method">  volume, bar_count, average</text>

  <rect x="930" y="265" width="220" height="140" class="node cat-lib" />
  <text x="1040" y="285" text-anchor="middle" class="label">logger.py</text>
  <text x="1040" y="301" text-anchor="middle" class="label">Structured logging (Singleton)</text>
  <text x="938" y="319" class="method">configure_pipeline_logging()</text>
  <text x="938" y="332" class="method">  → console (stdout) INFO</text>
  <text x="938" y="345" class="method">  → rotating file DEBUG (10MB×3)</text>
  <text x="938" y="358" class="method">get_logger(name) — idempotent</text>
  <rect x="930" y="450" width="220" height="125" class="node cat-lib" />
  <text x="1040" y="470" text-anchor="middle" class="label">stream_live_ticks()</text>
  <text x="1040" y="486" text-anchor="middle" class="label">Module-level (data_downloader.py)</text>
  <text x="938" y="504" class="method">ib, contracts, duration_secs, send_batch</text>
  <text x="938" y="517" class="method">→ Dict[str, int] (written per ric)</text>
  <text x="938" y="530" class="method">Uses _build_ilp_line() helper</text>
  <text x="938" y="543" class="method">Calls send_batch (qdb.send_ilp_batch)</text>
