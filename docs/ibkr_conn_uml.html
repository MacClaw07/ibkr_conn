  <text x="600" y="30" text-anchor="middle" class="title">ibkr_conn — Module Architecture</text>
  <text x="600" y="48" text-anchor="middle" class="subtitle">Updated: July 2026 · 8 Python modules · 3 zones · Typed DTOs · Singleton SessionManager · FOP support · Runtime resources</text>
  <rect x="30" y="60" width="1140" height="150" class="zone"/>
  <text x="40" y="77" class="zone-label">CLI Entry</text>
  <rect x="40" y="80" width="280" height="110" class="node cat-cli" />
  <text x="180" y="100" text-anchor="middle" class="label">run_service.py</text>
  <text x="180" y="116" text-anchor="middle" class="label">CLI entry point</text>
  <text x="48" y="134" class="method">Auto-reinvoke with project venv (os.execv)</text>
  <text x="48" y="147" class="method">main() — dispatch by --mode</text>
  <text x="48" y="160" class="method">build_ibkr_parser() — argparse</text>
  <text x="48" y="173" class="method">_clean_stale_pycache()</text>
  <text x="48" y="186" class="method">_handle_status() — health output</text>
  <rect x="30" y="220" width="1140" height="520" class="zone"/>

  <rect x="40" y="250" width="290" height="190" class="node cat-app" />
  <text x="185" y="270" text-anchor="middle" class="label">session_manager.py  🔒 Singleton</text>
  <text x="185" y="286" text-anchor="middle" class="label">SessionManager — owns IB + QuestDB</text>
  <text x="48" y="304" class="method">get_ib_conn()  (6×5s internal retry)</text>
  <text x="48" y="317" class="method">get_questdb() → QuestDBManager</text>
  <text x="48" y="330" class="method">on_error()  (signal connection death)</text>
  <text x="48" y="343" class="method">start() / stop() — gateway + QuestDB lifecycle</text>
  <text x="48" y="356" class="method">get_status() · keep_alive() · set_keepalive()</text>
  <text x="48" y="369" class="method">acquire_pid_lock() / release_pid_lock()</text>
  <text x="48" y="382" class="method">_ensure_gateway_ready() · set_gateway_status()</text>
  <text x="48" y="395" class="method">_get_gateway_status() · _force_disconnect_ib()</text>
  <text x="48" y="408" class="method">_on_gateway_terminated(pid) — callback</text>
  <text x="48" y="421" class="method">→ IBConnectionFatalError (6 fails)</text>
  <rect x="370" y="250" width="290" height="190" class="node cat-lib" />
  <text x="515" y="270" text-anchor="middle" class="label">data_downloader.py  📦 Client</text>
  <text x="515" y="286" text-anchor="middle" class="label">DataDownloader — uses SessionManager</text>
  <text x="378" y="304" class="method">__init__(mgr: SessionManager) — DI</text>
  <text x="378" y="317" class="method">download_bars() — error recovery + ILP write</text>
  <text x="378" y="330" class="method">  supports FUT + FOP (options) hist bars</text>
  <text x="378" y="343" class="method">start_streaming() — PID-locked entry</text>
  <text x="378" y="356" class="method">stream_data() — keepalive loop + reconnect</text>
  <text x="378" y="369" class="method">Module-level helpers:</text>
  <text x="378" y="382" class="method">  _generate_chunks() · _fetch_chunk()</text>
  <text x="378" y="395" class="method">  _download_bars() — multi-chunk + dedup</text>
  <text x="378" y="408" class="method">  _to_hist_bar() → HistBarData</text>
  <text x="378" y="421" class="method">  _to_hist_option_bar() → HistBarOptionData</text>
  <text x="378" y="434" class="method">  _build_ilp_line() — ticker → ILP line</text>
  <text x="378" y="447" class="method">  _stream_live_ticks() · _subscribe_contracts()</text>
  <text x="378" y="460" class="method">  _flush_pending_lines() · _log_stream_status()</text>
  <rect x="700" y="250" width="200" height="190" class="node cat-lib" />
  <text x="800" y="270" text-anchor="middle" class="label">utils.py</text>
  <text x="800" y="286" text-anchor="middle" class="label">Shared utilities (no connections)</text>
  <text x="708" y="304" class="method">build_ric_contract() → Future/FutOpt/Stock</text>
  <text x="708" y="317" class="method">resolve_contracts() — multi from dict</text>
  <text x="708" y="330" class="method">get_contract() — single from CLI args</text>
  <text x="708" y="343" class="method">parse_date_range()</text>
  <text x="708" y="356" class="method">load_tick_config() — JSON validation</text>
  <text x="708" y="369" class="method">_month_map()</text>
  <text x="708" y="382" class="method">resolve_option_underlying()</text>
  <rect x="40" y="475" width="290" height="210" class="node cat-app" />
  <text x="185" y="495" text-anchor="middle" class="label">ibgateway.py</text>
  <text x="185" y="511" text-anchor="middle" class="label">Gateway lifecycle (encapsulated)</text>
  <text x="48" y="529" class="method">IBGateway class:</text>
  <text x="48" y="542" class="method">  __init__(on_gateway_terminated=[])</text>
  <text x="48" y="555" class="method">  get_credentials() — static</text>
  <text x="48" y="568" class="method">  generate_config_ini(paper) — instance</text>
  <text x="48" y="581" class="method">  add_gateway_terminated_handler()</text>
  <text x="48" y="594" class="method">  start_gateway() — daemon subprocess</text>
  <text x="48" y="607" class="method">  stop_gateway() — socket STOP + Java kill</text>
  <text x="48" y="620" class="method">  ensure_gateway(mgr, timeout) — auto-restart</text>
  <text x="48" y="633" class="method">  wait_for_api(mgr, timeout) — poll loop</text>
  <text x="48" y="646" class="method">  _send_stop_via_nc() — private</text>
  <text x="48" y="659" class="method">  _kill_java_processes() — private</text>
  <text x="48" y="672" class="method">  _probe_gateway_api() — temp IB() probe</text>
  <text x="48" y="685" class="method">    (never exports IB instance)</text>
  <text x="48" y="698" class="method">Module-level:</text>
  <text x="48" y="711" class="method">  get_credentials() · generate_config_ini()</text>
  <text x="48" y="724" class="method">  install_scripts()</text>
  <rect x="370" y="475" width="290" height="210" class="node cat-app" />
  <text x="515" y="495" text-anchor="middle" class="label">questdb.py</text>
  <text x="515" y="511" text-anchor="middle" class="label">QuestDBManager — ILP writer (no IB dep)</text>
  <text x="378" y="529" class="method">QuestDBManager:</text>
  <text x="378" y="542" class="method">  __init__(host, port=9000)</text>
  <text x="378" y="555" class="method">  url property → REST base URL</text>
  <text x="378" y="568" class="method">  send_ilp_batch(lines) → int (count written)</text>
  <text x="378" y="581" class="method">  write_bars() → futures_hist / options_hist</text>
  <text x="378" y="594" class="method">    supports FUT + FOP sec types</text>
  <text x="378" y="607" class="method">  write_ticks() → futures_tick</text>
  <text x="378" y="620" class="method">  Static: is_port_open(host, port)</text>
  <text x="378" y="633" class="method">  Static: is_questdb_running()</text>
  <text x="378" y="646" class="method">  Static: find_questdb_pid()</text>
  <text x="378" y="659" class="method">  Static: _ok(val) — NaN guard</text>
  <text x="378" y="672" class="method">  Static: _format_ilp_timestamp(dt) → ns</text>
  <text x="378" y="685" class="method">Module-level:</text>
  <text x="378" y="698" class="method">  start_questdb() · stop_questdb()</text>
  <text x="378" y="711" class="method">  (called by SessionManager)</text>
  <rect x="700" y="490" width="240" height="120" class="node cat-risk" />
  <text x="820" y="510" text-anchor="middle" class="label">🔐 IB() Guard Rule</text>
  <text x="820" y="526" text-anchor="middle" class="label">Only session_manager.py may</text>
  <text x="820" y="542" text-anchor="middle" class="label">construct ib_async.IB()</text>
  <text x="820" y="558" text-anchor="middle" class="label">or call ib.connect().</text>
  <text x="708" y="576" class="method">ibgateway._probe_gateway_api() uses temp IB()</text>
  <text x="708" y="589" class="method">for availability probing only —</text>
  <text x="708" y="602" class="method">never exports or stores the instance.</text>
